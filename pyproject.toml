[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-ai-benchmarking"
version = "0.1.0"
description = "A reusable Django app integrating ai-benchmarking for automated model evaluation."
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0",
    "ai-benchmarking",
]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

[project.urls]
Repository = "https://github.com/your-org/django-ai-benchmarking"

[tool.setuptools.packages.find]
where = ["."]
include = ["django_ai_benchmarking*"]